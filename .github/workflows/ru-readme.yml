name: Folkbench RU catalog snapshot
# Раз в сутки обновляет только блок ru-catalog в README.md из публичного снимка ru.folkbench.com.
# Если снимок недоступен или не прошёл проверку, скрипт завершается с ошибкой и README не меняется.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ru-readme
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'Folkbench/folkbench-ru' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Update only the ru-catalog marker block
        id: readme
        run: bun scripts/ru-readme.mjs
      - name: Commit and push README.md
        if: steps.readme.outputs.changed == 'true'
        env:
          SNAPSHOT_ID: ${{ steps.readme.outputs.snapshot_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "Данные: снимок каталога ${SNAPSHOT_ID}"
          git push origin HEAD:main
